<div class="modal-dialog modal-md modal-dialog-centered" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <div class = "icon-container">
                <div class = "icon icon-success"></div>                                 
            </div>
            <h2>Correo enviado</h2>
            <button type="button" onclick="closeModal()" className="btn btn-close-modal" data-bs-dismiss="modal"
                aria-label="Close"></button>
            <p>Por favor revisa la bandeja de entrada en tu correo electrónico</p>
        </div>
        <div class="modal-body">
            <div class="container-text">
                <p>¿No recibiste el correo?</p>
                <a href="#" onclick="openModal('{% url 'reset_password' %}', '{% url 'password_reset_done' %}')">Volver a enviar</a>
            </div>
        </div>
    </div>
</div>
